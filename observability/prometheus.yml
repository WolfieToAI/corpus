global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: corpus-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Every worker replica serves its own /metrics: DNS discovery finds all of them,
  # however many `docker compose up --scale worker=N` started.
  - job_name: corpus-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
