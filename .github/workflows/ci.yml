name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: corpus
          POSTGRES_PASSWORD: corpus
          POSTGRES_DB: corpus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corpus -d corpus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://corpus:corpus@localhost:5432/corpus_test
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v --durations=10

  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check src/corpus/web/static/widget.js
      - run: node --test "tests/widget/*.test.cjs"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t corpus:ci .
      - name: OCR works inside the image
        run: docker run --rm corpus:ci python -m corpus.services.ocr
      - name: Migrations run inside the image
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=corpus -e POSTGRES_PASSWORD=corpus \
            -e POSTGRES_DB=corpus pgvector/pgvector:pg17
          for i in $(seq 1 30); do docker exec db pg_isready -U corpus -d corpus && break; sleep 1; done
          sleep 3  # the official image restarts the server once after initdb
          docker run --rm --network ci \
            -e DATABASE_URL=postgresql+asyncpg://corpus:corpus@db:5432/corpus \
            corpus:ci alembic upgrade head
      - name: Free-hosting demo mode boots from an empty database
        # Same settings as render.yaml: migrations at startup, embedded worker, self-seeding
        # demo; a platform-style postgres:// URL; then the published widget key must answer.
        run: |
          docker exec db psql -U corpus -c "CREATE DATABASE demo"
          docker run -d --name app --network ci -p 8000:8000 \
            -e DATABASE_URL=postgres://corpus:corpus@db:5432/demo \
            -e AUTO_MIGRATE=true -e EMBEDDED_WORKER=true -e DEMO_MODE=true \
            -e PUBLIC_URL=http://localhost:8000 -e EMBEDDING_PROVIDER=hash -e LLM_PROVIDER=extractive \
            corpus:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/demo/config > config.json && break; sleep 2; done
          test -s config.json || { docker logs app; exit 1; }
          COLLECTION=$(python3 -c "import json; print(json.load(open('config.json'))['collection'])")
          KEY=$(python3 -c "import json; print(json.load(open('config.json'))['key'])")
          for i in $(seq 1 60); do
            curl -sf -X POST localhost:8000/v1/collections/$COLLECTION/search \
              -H "X-API-Key: $KEY" -H "Origin: http://localhost:8000" -H "Content-Type: application/json" \
              -d '{"query": "What does error E-317 mean?", "mode": "keyword"}' | grep -q "E-317" && exit 0
            sleep 2
          done
          docker logs app; exit 1
